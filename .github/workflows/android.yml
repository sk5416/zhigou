name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install -r requirements.txt
      - run: python tools/content.py check
      - run: python tools/content.py check --reviewed
      - run: python -m unittest discover -s tools/tests -v
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zhigou-development-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '29'
            target: default
          - api: '37.0'
            target: google_apis_ps16k
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install -r requirements.txt
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Build genuine dev.7 upgrade baseline
        run: |
          mkdir "$RUNNER_TEMP/zhigou-dev7"
          git archive f2a2c6ff7215ef13558cc6018d1dfe9dd9994295 | tar -x -C "$RUNNER_TEMP/zhigou-dev7"
          chmod +x "$RUNNER_TEMP/zhigou-dev7/gradlew"
          "$RUNNER_TEMP/zhigou-dev7/gradlew" -p "$RUNNER_TEMP/zhigou-dev7" assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest || { adb pull /sdcard/Pictures/zhigou-tests device-screenshots || true; exit 1; }
            adb pull /sdcard/Pictures/zhigou-tests device-screenshots
            python tools/run_upgrade.py "$RUNNER_TEMP/zhigou-dev7/app/build/outputs/apk/debug/app-debug.apk" app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python tools/run_process_recovery.py
            python tools/run_interrupted_writes.py
            python tools/run_background_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api }}
          include-hidden-files: true
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-screenshots/
            .artifacts/process-recovery-report.json
            .artifacts/interrupted-writes-report.json
            .artifacts/upgrade-report.json
            .artifacts/background-recovery-report.json
